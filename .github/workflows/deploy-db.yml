name: Deploy database migrations

# Any push to main that touches supabase/migrations/** applies the new
# migrations to the live Supabase project. Edit a migration, push, done —
# no manual SQL. Needs two repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {} # allow running it manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: omjfegdksixbhhlgqvsx
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Push migrations
        run: supabase db push
